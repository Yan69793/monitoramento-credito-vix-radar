#   escrita sem lock em persistirResultadoCompartilhado/rodarSweepRevalidacao.
#   KV nao tem CAS; fix real exige Durable Object serializando escrita por
#   semana (nova classe + migration + binding) OU quebrar o blob em chave por
#   empresa (migracao de dado, toca 5 endpoints multi-semana). Ambos sao
#   mudanca estrutural, nao cirurgica - decidido nao empilhar no mesmo deploy
