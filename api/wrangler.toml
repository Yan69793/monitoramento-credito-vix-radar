# Deploy: `npx wrangler deploy` (de api/, com CLOUDFLARE_API_TOKEN no ambiente).
name       = "radar-credito-api"
main       = "v4.9.158.js"
compatibility_date  = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

account_id = "7ac79fb1030e4e81115ef33c21a9b070"

# ─── KV NAMESPACE (produção) ──────────────────────────────────────────
[[kv_namespaces]]
binding = "RADAR_KV"
id      = "c6805b8d8a7b468e9f854ab4f91fb93a"

# ─── DURABLE OBJECT ───────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

[[migrations]]
tag               = "v1"
new_sqlite_classes = ["RateLimiterDO"]

# ─── ANALYTICS ENGINE ─────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "RADAR_USAGE_EVENTS"
dataset = "radar_usage_events"

# ─── VARIÁVEIS ────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "7ac79fb1030e4e81115ef33c21a9b070"
ADMIN_EMAIL = "szuchmacheryan@gmail.com"
# false = cron nao roda executarVarreduraMatinal/BatchComFila (Claude tiered v2 assume analise AI)
VARREDURA_CRON_AI_ENABLED = "false"

# ─── CUSTOM DOMAIN ────────────────────────────────────────────────────
# api.vixradar.com é o AG_API usado pelo frontend para login/auth.
# OBRIGATÓRIO declarar aqui — deploy sem esta seção remove o route binding do dashboard.
[[routes]]
pattern = "api.vixradar.com"
custom_domain = true

# ─── CRON TRIGGERS ────────────────────────────────────────────────────
# IMPORTANTE: estes triggers DEVEM permanecer aqui. Se removidos do .toml,
# o `wrangler deploy` NÃO os apaga automaticamente do dashboard (verificado
# em 2026-05-07 via Cloudflare API), mas ter no .toml é defesa em
# profundidade — versionado em git, recuperável após qualquer mudança.
#
# Confirmados via API CF em 2026-05-07T07:14Z; v4.9.132 restaura varredura AI no Worker:
#   - 30 15 * * *    → matinal 12:30 BRT (sync_cvm + recalc + executarVarreduraMatinal + saldo; dia util via ehDiaPregaoB3)
#   - 30 21 * * *    → noturno 18:30 BRT (sync_cvm + recalc + sync_anbima + executarVarreduraBatchComFila + newsletter + saldo + healthcheck)
#   - 0 1 * * *      → watchdog 22:00 BRT, diário
#   - 0 4 * * *      → agenda build 01:00 BRT (agendaBuildPersistir: calendário 90 dias → KV agenda:eventos:v1, TTL 3d)
#                      (era "0 2 * * *" = 23h BRT, caía no else/noturno duplicando pipeline — corrigido 2026-06-14)
[observability]
enabled           = true
head_sampling_rate = 1

[triggers]
crons = [
  "30 15 * * *",
  "30 21 * * *",
  "0 1 * * *",
  "0 4 * * *"
]
