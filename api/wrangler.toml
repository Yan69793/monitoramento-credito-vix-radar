# Deploy: `npx wrangler deploy` (de api/, com CLOUDFLARE_API_TOKEN no ambiente).
name       = "radar-credito-api"
main       = "v4.9.231.js"
compatibility_date  = "2026-06-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# SENTRY1 (v4.9.184): NAO adicionar no_bundle = true nem --no-bundle no deploy.
# Desde v4.9.184 o bundle tem import real de npm (@sentry/cloudflare), resolvido
# pelo esbuild embutido no Wrangler. Comentarios antigos em build-worker.ps1 e no
# cabecalho de src/worker.js falam em "no_bundle=true" — era intencao, nunca foi
# configurado. Ligar isso agora quebra o import e o Worker para de subir.
# Requisito associado: deploy-worker.ps1 roda `npm ci` em api/ antes do deploy.

account_id = "7ac79fb1030e4e81115ef33c21a9b070"

# ─── KV NAMESPACE (produção) ──────────────────────────────────────────
[[kv_namespaces]]
binding = "RADAR_KV"
id      = "c6805b8d8a7b468e9f854ab4f91fb93a"

# ─── DURABLE OBJECT ───────────────────────────────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER_DO"
class_name = "RateLimiterDO"

# RACEKV1 (v4.9.165): serializa leitura-modificacao-escrita do blob radar:estado:{semana}.
[[durable_objects.bindings]]
name       = "ESTADO_SEMANA_DO"
class_name = "EstadoSemanaDO"

# MIGRACAO KV->DO (v5): Durable Objects para substituir chaves KV por dominio.
# EmissorDO: 1 instancia por emissor (idFromName), armazena series, flags,
#   ews_hist, features, alertas e comentarios daquele emissor.
[[durable_objects.bindings]]
name       = "EMISSOR_DO"
class_name = "EmissorDO"

# UsuarioDO: 1 instancia por usuario (idFromName), armazena perfil, favoritos
#   e analises privadas. Dados LGPD isolados por instancia.
[[durable_objects.bindings]]
name       = "USUARIO_DO"
class_name = "UsuarioDO"

# ConfigDO: singleton (idFromName("_global")), armazena configs globais de
#   baixa concorrencia (calendario, providers, tenant, anomalias, eventos).
[[durable_objects.bindings]]
name       = "CONFIG_DO"
class_name = "ConfigDO"

[[migrations]]
tag               = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[migrations]]
tag               = "v2"
new_sqlite_classes = ["EstadoSemanaDO"]

[[migrations]]
tag               = "v3"
new_sqlite_classes = ["EmissorDO", "UsuarioDO", "ConfigDO"]

# ─── ANALYTICS ENGINE ─────────────────────────────────────────────────
[[analytics_engine_datasets]]
binding = "RADAR_USAGE_EVENTS"
dataset = "radar_usage_events"

# ─── VARIÁVEIS ────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
CLOUDFLARE_ACCOUNT_ID = "7ac79fb1030e4e81115ef33c21a9b070"
# ADMIN_EMAIL movido para wrangler secret em 2026-07-24 (Etapa 1 security fix)
# O Worker le de env.ADMIN_EMAIL em runtime — o secret precisa existir no Cloudflare
# false = cron nao roda executarVarreduraMatinal/BatchComFila (Claude tiered v2 assume analise AI)
VARREDURA_CRON_AI_ENABLED = "false"
# 2026-07-23: habilita envio do boletim diario por email via Resend (estava desligado desde v4.9.119)
RELATORIO_DIARIO_ENABLED = "1"
EMAIL_ALERTAS_ENABLED = "1"

# ─── CUSTOM DOMAIN ────────────────────────────────────────────────────
# api.vixradar.com é o AG_API usado pelo frontend para login/auth.
# OBRIGATÓRIO declarar aqui — deploy sem esta seção remove o route binding do dashboard.
[[routes]]
pattern = "api.vixradar.com"
custom_domain = true

# ─── CRON TRIGGERS ────────────────────────────────────────────────────
# IMPORTANTE: estes triggers DEVEM permanecer aqui. Se removidos do .toml,
# o `wrangler deploy` NÃO os apaga automaticamente do dashboard (verificado
# em 2026-05-07 via Cloudflare API), mas ter no .toml é defesa em
# profundidade — versionado em git, recuperável após qualquer mudança.
#
# Confirmados via API CF em 2026-05-07T07:14Z; v4.9.132 restaura varredura AI no Worker:
#   - 30 15 * * *    → matinal 12:30 BRT (sync_cvm + recalc + executarVarreduraMatinal + saldo; dia util via ehDiaPregaoB3)
#   - 30 21 * * *    → noturno 18:30 BRT (sync_cvm + recalc + sync_anbima + executarVarreduraBatchComFila + newsletter + saldo + healthcheck)
#   - 0 1 * * *      → watchdog 22:00 BRT, diário
#   - 0 4 * * *      → agenda build 01:00 BRT (agendaBuildPersistir: calendário 90 dias → KV agenda:eventos:v1, TTL 3d)
#                      (era "0 2 * * *" = 23h BRT, caía no else/noturno duplicando pipeline — corrigido 2026-06-14)
[observability]
enabled           = true
head_sampling_rate = 1

[triggers]
crons = [
  "30 15 * * *",
  "30 21 * * *",
  "0 1 * * *",
  "0 4 * * *"
]
