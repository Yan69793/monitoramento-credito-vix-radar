# v4.9.155.js = v4.9.154 + auditoria 2026-07-14 (queixa "cliente pediu acesso
#   e nao apareceu no painel nem no email"): diagnostico concluiu que o caminho
#   de registro estava funcional (cliente Pedro Stenzel nunca existiu no KV —
#   nunca completou o formulario; queixa veio so por WhatsApp). Duas melhorias
#   de robustez no handleRegistrar:
#   (1) OBS registrar cego: os returns de falha (400 validacao, 409 ja existe)
#   e o catch do email ao admin nao geravam telemetria nenhuma — um cadastro
#   que falha era 100% invisivel. Agora emite evento "registrar_rejeitado"
#   (motivo: campos_faltando/email_invalido/senha_curta/sem_consentimento/
#   ja_pendente/ja_aprovado) e "registrar_email_admin_erro"; catch {} vazio do
#   enviarResend virou log + telemetria.
#   (2) PROD reinscricao: status "rejeitado" era beco sem saida (409 permanente
#   "Solicitacao anterior recusada") — usuario rejeitado nunca mais conseguia
#   se cadastrar e o unico sinal era uma mensagem na tela dele. Agora rejeitado
#   que re-registra volta para "pendente" e re-notifica o admin (assunto
#   "Reinscricao apos recusa"); putUser preserva _status_historico e created_at
#   original, user ganha flag reinscricao. Admin mantem controle total (tem que
#   reaprovar — ninguem entra sem aprovacao). Telemetria "registrar_reinscricao".
#   (3) PROD aprovacao via WhatsApp: pedido explicito do operador ("quero que
#   solicitacoes aparecam no meu whatsapp para eu aprovar"). enviarWhatsAppAdmin
#   ja disparava a cada novo registro, mas so linkava pro painel (exige login).
#   Reusa o MESMO mecanismo ja em producao no fluxo de email (link assinado
#   HMAC-SHA256 via gerarTokenEmail/verificarTokenEmail, TTL 7 dias,
#   action=aprovar_email/rejeitar_email) — corpo da mensagem WhatsApp passa a
#   incluir os 2 links assinados (aprovar/rejeitar em 1 toque), com o link do
#   painel como alternativa. Zero infra nova, zero endpoint novo.
# v4.9.153.js = v4.9.152 + FIX STATELEAK1 (2026-07-13, investigação de queixa
#   ao vivo do operador: "sistema continua sem estar atualizado até 10/07").
#   Causa raiz confirmada por leitura direta do KV de produção (autorizada
#   explicitamente pelo operador): radar:estado:2026-W28 tem 125 chaves em
#   `results`, mas EMISSORES_LISTA só tem 103 — as 22 extras são resíduo do
#   bug de mojibake (ENC1, corrigido 09/07) e de teste manual, todas travadas
#   em 06/07, 08/07 ou 10/07 (nunca mais atualizadas): "Raízen" tinha 3 chaves
#   diferentes (`RaÃ­zen`, `Raizen`, `Ra�zen`) além da correta, mesmo padrão em
#   Kora Saúde, Pão de Açúcar (GPA), Itaú Unibanco, Vivo, +11 outras. `op=state`
#   (dado principal do painel logado) e `montarBriefingInterno` (usa por
#   `briefing_executivo`) mandavam as 125 chaves para o frontend SEM filtrar
#   contra EMISSORES_LISTA - as 3 outras rotas que usam
#   carregarEstadoMultiSemana (`ews` ranking, `historico_emissor`, `comparar`)
#   já eram seguras (iteram EMISSORES_LISTA ou fazem lookup por chave
#   específica). Fix: `.filter(EMISSORES_LISTA.includes)` nos 2 pontos.
#   Validado com o dado real de produção (backup local antes do fix):
#   125→103 após filtro, Cosan (CRITICO real, 12/07) sobrevive, só a chave
#   "Raízen" corretamente acentuada sobrevive das 4 variantes. NÃO apaga as
#   22 chaves-lixo do KV (proposta separada, ação destrutiva, aguarda decisão
#   própria do operador) - só impede que cheguem ao frontend.
# v4.9.152.js = v4.9.151 + rodada 2 da auditoria 2026-07-13 (3 dos 5 P1
#   adiados no v4.9.151, atacados a pedido explicito do operador):
#   (1) FIX ANOMPROMO1: recalcularTodasAnomalias (cron, ~9 call-sites)
#   recalculava do zero e sobrescrevia KV_ANOMALIAS_ATIVAS inteiro sem saber
#   quais anomalias ja tinham sido promovidas por admin (handlePromoverAnomalia
#   as remove da lista ativa e move para eventos:confirmados:promovidos). Se a
#   condicao de mercado que gerou a anomalia continuasse verdadeira, a proxima
#   execucao do cron detectava de novo e a promocao "sumia" da perspectiva do
#   admin. Fix: carrega eventos:confirmados:promovidos 1x por execucao, filtra
#   anomalias cujo empresa+tipo ja consta como promovido antes de gravar.
#   Validado isolado (2 casos: anomalia promovida filtrada, anomalia nao
#   promovida preservada).
#   (2) FIX RLADMIN1: login e registrar nao tinham nenhum rate limit (so
#   consulta_empresa/pulso usava checkRateLimitV2). Login sem limite = brute
#   force de senha (inclusive conta admin) sem throttling de aplicacao. Fix:
