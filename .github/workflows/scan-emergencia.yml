# Fallback de emergencia: so roda quando o estado principal esta stale.
name: Scan de Emergencia (Opcao B)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: read

concurrency:
  group: scan-emergencia
  cancel-in-progress: false

jobs:
  scan-emergencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Pre-check de secrets (fallback desarmado vira falha)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIXRADAR_OPENROUTER_API_KEY: ${{ secrets.VIXRADAR_OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROUTINE_API_KEY: ${{ secrets.ROUTINE_API_KEY }}
          VIXRADAR_FALLBACK_PROVIDER: ${{ vars.VIXRADAR_FALLBACK_PROVIDER || 'anthropic' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROUTINE_API_KEY:-}" ]]; then
            echo "::error::ROUTINE_API_KEY ausente nos secrets do repo. Fallback de emergencia desarmado."
            exit 1
          fi
          # Provider-aware: exige a chave do provider ATIVO, nunca a de um provider inativo.
          # ANTHROPIC_API_PAYG = NAO AUTORIZADO: com vars.VIXRADAR_FALLBACK_PROVIDER=openrouter
          # o fallback roda sem chave Anthropic paga.
          provider="${VIXRADAR_FALLBACK_PROVIDER:-anthropic}"
          case "$provider" in
            anthropic)
              if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
                echo "::error::provider anthropic ativo e ANTHROPIC_API_KEY ausente nos secrets. Fallback de emergencia desarmado. Configure vars.VIXRADAR_FALLBACK_PROVIDER=openrouter para nao depender de chave Anthropic paga."
                exit 1
              fi
              ;;
            openrouter)
              if [[ -z "${VIXRADAR_OPENROUTER_API_KEY:-}" && -z "${OPENROUTER_API_KEY:-}" ]]; then
                echo "::error::provider openrouter ativo e nenhuma chave OpenRouter presente (VIXRADAR_OPENROUTER_API_KEY ou OPENROUTER_API_KEY). Fallback de emergencia desarmado."
                exit 1
              fi
              ;;
            *)
              echo "::error::VIXRADAR_FALLBACK_PROVIDER desconhecido: '$provider'. Aceitos: anthropic, openrouter."
              exit 1
              ;;
          esac
          echo "Pre-check ok: provider=$provider"

      - name: Gate de staleness
        id: gate
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "::error::ADMIN_PASSWORD ausente; nao e possivel provar o frescor."
            exit 1
          fi
          echo "::add-mask::$ADMIN_PASSWORD"
          body=$(jq -n --arg pw "$ADMIN_PASSWORD" '{action:"admin_health_check",admin_senha:$pw}')
          hc=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body" --max-time 60)
          echo "$hc" | jq -e '.ok == true' >/dev/null
          echo "$hc" | jq '{ok,versao,empresas_com_dados:.checks.estado_semanal.empresas_com_dados,updated_at:.checks.estado_semanal.updated_at}'

          updated=$(echo "$hc" | jq -er '.checks.estado_semanal.updated_at // "null"')
          if [[ "$updated" == "null" ]]; then
            echo 'prosseguir=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          updated_epoch=$(date -d "$updated" +%s)
          now_epoch=$(date +%s)
          if (( updated_epoch > now_epoch + 300 )); then
            echo "::error::updated_at esta no futuro: $updated"
            exit 1
          fi
          age_h=$(( (now_epoch - updated_epoch) / 3600 ))
          echo "Idade do estado: ${age_h}h"
          if (( age_h < 24 )); then
            echo 'prosseguir=false' >> "$GITHUB_OUTPUT"
          else
            echo 'prosseguir=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Scan de emergencia
        if: steps.gate.outputs.prosseguir == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VIXRADAR_OPENROUTER_API_KEY: ${{ secrets.VIXRADAR_OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ROUTINE_API_KEY: ${{ secrets.ROUTINE_API_KEY }}
          VIXRADAR_FALLBACK_PROVIDER: ${{ vars.VIXRADAR_FALLBACK_PROVIDER || 'anthropic' }}
        run: node scripts/scan-emergencia.mjs