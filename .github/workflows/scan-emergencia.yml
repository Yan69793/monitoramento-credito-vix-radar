# Fallback de emergencia: so roda quando o estado principal esta stale.
name: Scan de Emergencia (Opcao B)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: read

concurrency:
  group: scan-emergencia
  cancel-in-progress: false

jobs:
  scan-emergencia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gate de staleness
        id: gate
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_PASSWORD:-}" ]]; then
            echo "::error::ADMIN_PASSWORD ausente; nao e possivel provar o frescor."
            exit 1
          fi
          echo "::add-mask::$ADMIN_PASSWORD"
          body=$(jq -n --arg pw "$ADMIN_PASSWORD" '{action:"admin_health_check",admin_senha:$pw}')
          hc=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body" --max-time 60)
          echo "$hc" | jq -e '.ok == true' >/dev/null
          echo "$hc" | jq '{ok,versao,empresas_com_dados:.checks.estado_semanal.empresas_com_dados,updated_at:.checks.estado_semanal.updated_at}'

          updated=$(echo "$hc" | jq -er '.checks.estado_semanal.updated_at // "null"')
          if [[ "$updated" == "null" ]]; then
            echo 'prosseguir=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          updated_epoch=$(date -d "$updated" +%s)
          now_epoch=$(date +%s)
          if (( updated_epoch > now_epoch + 300 )); then
            echo "::error::updated_at esta no futuro: $updated"
            exit 1
          fi
          age_h=$(( (now_epoch - updated_epoch) / 3600 ))
          echo "Idade do estado: ${age_h}h"
          if (( age_h < 24 )); then
            echo 'prosseguir=false' >> "$GITHUB_OUTPUT"
          else
            echo 'prosseguir=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Scan de emergencia
        if: steps.gate.outputs.prosseguir == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROUTINE_API_KEY: ${{ secrets.ROUTINE_API_KEY }}
        run: node scripts/scan-emergencia.mjs