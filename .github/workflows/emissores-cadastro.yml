name: Cadastro dos Emissores

# NOMEMORTO1 (2026-08-24). A Eletrobras virou AXIA ENERGIA em 10/11/2025 e o
# projeto passou nove meses procurando documento e noticia por um nome que a CVM
# nao registra mais. Na mesma varredura apareceram CCR -> Motiva e Omega -> Serena.
# Nenhuma das tres tinha como ser notada: nada comparava a lista de emissores com
# o cadastro vivo da CVM.
#
# Roda na nuvem de proposito. O canal local equivalente, VIXRadar-Health-Watch,
# foi desligado em 21/08 e a fonte da CVM ficou escura quatro dias sem ninguem ver.
# Guarda que depende de maquina ligada nao e guarda.
#
# Semanal porque renomeacao societaria e evento raro e o cadastro so muda de
# madrugada. Diario aqui seria ruido sem ganho.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'api/src/worker.js'
      - 'app/index.html'
      - 'scripts/check-emissores-cadastro.mjs'
      - 'scripts/check-metricas-curadas.mjs'
      - 'scripts/check-emissores-cnpj.mjs'
      - 'scripts/emissores-cnpj.mjs'
      - 'scripts/check-cnpj-familia.mjs'
      - 'scripts/gerar-familia-cnpj.mjs'
      - 'scripts/predictive/cnpj_emissores.json'
      - 'scripts/predictive/cnpj_emissores.overrides.json'
      - 'data/cvm-referencia/**'
      - '.github/workflows/emissores-cadastro.yml'

permissions:
  contents: read

concurrency:
  group: emissores-cadastro
  cancel-in-progress: false

jobs:
  cadastro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Conferir emissores contra o cadastro vivo da CVM
        run: node scripts/check-emissores-cadastro.mjs

      # SENDASGPA1 (2026-08-24). Nao depende de rede: le so o worker.js. Roda antes da
      # prova negativa da guarda de cadastro para falhar cedo quando o problema e interno.
      - name: Conferir coerencia das tabelas de alias
        run: node scripts/check-alias-coerencia.mjs

      # CURADORIA1 (2026-08-24). A troca de carteira do commit b13b605 mexeu so no
      # backend. O frontend ficou com AES Brasil no menu e sem card nenhum para a
      # Braskem, que no mesmo dia protocolou recuperacao extrajudicial de US$ 10,9 bi.
      # O painel exibia os quatro cards de risco vazios e ninguem viu, porque nada
      # comparava EMISSORES_LISTA com EMISSORES e METRICAS_CURADAS. Offline, le so
      # worker.js e app/index.html.
      - name: Conferir cobertura e frescor dos cards de metrica
        run: node scripts/check-metricas-curadas.mjs

      # CURADORIA2 (2026-08-24), estendida em 2026-08-25 pelo SUBSTRINGDONO1. De
      # qual companhia da CVM sai o numero de cada emissor. Casar por nome erra e
      # erra feio, holding e subsidiaria compartilham o nome: Sabesp casava com a
      # COPASA, Taesa com a Copel GT, CBA com a CEB, CSN com a CSN Mineracao.
      # Offline, confere cobertura e exclusividade da carteira, e desde a fase CNPJ
      # tambem reconcilia as quatro copias de dado que passaram a existir: este
      # arquivo (canonico), scripts/predictive/cnpj_emissores.json (mesmo uso, gerado
      # por outro script), e CNPJ_PRIMARIO_EMISSOR / CNPJ_FAMILIA_CVM dentro do
      # worker.js (o Worker roda no Cloudflare e nao importa codigo local de guarda).
      # E o mesmo padrao do NOMEMORTO1, tres tabelas de alias que precisavam
      # concordar e nao concordavam, agora em quatro tabelas de CNPJ.
      - name: Conferir tabela emissor para companhia da CVM
        run: node scripts/check-emissores-cnpj.mjs

      # SUBSTRINGDONO1 (2026-08-25). A atribuicao de documento do IPE passou a usar
      # CNPJ_FAMILIA_CVM em vez de nome. Esta guarda pergunta o oposto do que o
      # CURADORIA2 pergunta: existe CNPJ que protocolou no ano, cujo NOME sugere um
      # emissor da carteira, e que ninguem declarou nem recusou? Foi exatamente esse
      # estado que deixou a CSN sem fonte primaria por meses, so que la ninguem via
      # porque nada perguntava. Offline, le so o worker.js e o indice do ano em
      # data/cvm-referencia/, versionado e fixo de proposito.
      - name: Conferir familia de CNPJ para atribuicao de documento CVM
        run: node scripts/check-cnpj-familia.mjs

      # Prova da outra ponta, dentro do proprio CI. Sem isto, um bug que fizesse a
      # guarda aprovar qualquer coisa passaria despercebido para sempre, porque o
      # caso bom continuaria verde. Ja aconteceu no desenvolvimento desta guarda:
      # a primeira versao aprovava um emissor inventado.
      - name: Guarda tem que reprovar emissor com nome morto
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's/(var EMISSORES_LISTA\s*=\s*\[\n)/$1  "Zzqx Holdings Renomeada",\n/' \
            api/src/worker.js > /tmp/guarda/worker_fake.js
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_fake.js node scripts/check-emissores-cadastro.mjs; then
            echo "::error::A guarda APROVOU um emissor com nome que a CVM nao registra. Ela esta quebrada e nao protege nada."
            exit 1
          fi
          echo "OK: guarda reprovou o emissor inventado, como deve."

      # Mesma logica para a guarda de alias, e pelo mesmo motivo. Aqui a injecao reproduz o
      # bug real do SENDASGPA1: dois aliases onde um contem o outro apontando para
      # emissores diferentes. Usa um emissor ASCII de proposito - a primeira versao deste
      # teste injetou um nome acentuado via escape \xNN, o perl gravou o byte latin-1 cru,
      # o arquivo deixou de ser UTF-8 valido e a guarda reprovou por lixo de encoding em
      # vez de reprovar pela regra. Teste que passa pelo motivo errado nao prova nada.
      - name: Guarda tem que reprovar alias contraditorio
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's/(var SYNC_ALIAS_TO_EMPRESA\s*=\s*\{\r?\n)/$1  "SENDAS DISTRIBUIDORA": "Simpar",\r\n/' \
            api/src/worker.js > /tmp/guarda/worker_alias.js
          if ! grep -q '"SENDAS DISTRIBUIDORA": "Simpar"' /tmp/guarda/worker_alias.js; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_alias.js node scripts/check-alias-coerencia.mjs; then
            echo "::error::A guarda APROVOU dois aliases contraditorios. Ela esta quebrada e nao protege nada."
            exit 1
          fi
          echo "OK: guarda reprovou o alias contraditorio, como deve."

      # CURADORIA1, ponta negativa 1 de 2: cobertura. Reproduz o defeito real, emissor
      # entra na carteira e o frontend nao acompanha. Nome ASCII de proposito, o
      # perl -0pe ja gravou byte latin-1 cru num teste anterior e ele passou pelo
      # motivo errado, reprovando por encoding em vez de reprovar pela regra.
      - name: Guarda tem que reprovar emissor sem card de metrica
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          # \r?\n e nao \n: o checkout do CI vem com LF, mas o working tree do Windows
          # vem com CRLF (core.autocrlf=true). Com \n cru a substituicao nao entra no
          # Windows, o grep abaixo pega, e o teste nao passa achando que provou algo.
          perl -0pe 's/(var EMISSORES_LISTA\s*=\s*\[\r?\n)/$1  "Zzqx Petroquimica",\n/' \
            api/src/worker.js > /tmp/guarda/worker_semcard.js
          if ! grep -q '"Zzqx Petroquimica"' /tmp/guarda/worker_semcard.js; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_semcard.js node scripts/check-metricas-curadas.mjs; then
            echo "::error::A guarda APROVOU um emissor da carteira sem card de metrica. Ela esta quebrada e nao protege nada."
            exit 1
          fi
          echo "OK: guarda reprovou o emissor sem card, como deve."

      # CURADORIA1, ponta negativa 2 de 2: frescor. METRICAS_HOJE injeta o relogio,
      # senao o teste caducaria sozinho: um as_of escolhido hoje para estar vencido
      # pode estar valido daqui a um trimestre, e o teste passaria a falhar pelo
      # motivo errado. Com a data fixa, 2T26 esta vencido porque 3T26 ja passou da
      # janela de 45 dias mais 15 de tolerancia.
      - name: Guarda tem que reprovar card com as_of vencido para o tipo
        run: |
          set -euo pipefail
          if METRICAS_HOJE=2027-01-15 node scripts/check-metricas-curadas.mjs; then
            echo "::error::A guarda APROVOU card de ITR com as_of vencido. A regra de frescor nao esta valendo."
            exit 1
          fi
          echo "OK: guarda reprovou o card defasado, como deve."

      # Terceira ponta, o caso bom no mesmo relogio do caso ruim. Sem isto, uma guarda
      # que reprovasse tudo passaria nos dois testes negativos acima e pareceria sadia.
      - name: Guarda tem que aceitar o repo como esta
        run: node scripts/check-metricas-curadas.mjs

      # EXCECAO-FRESCOR1. O terceiro estado (card recurado, datacao real, fora da
      # janela) so vale se nao virar um segundo silencio. As quatro etapas abaixo
      # existem porque cada uma cobre um jeito diferente de o mecanismo apodrecer.
      #
      # ARMADILHA para quem for mexer nestas etapas: nao usar `node ... | grep`. Com
      # pipefail a pipeline herda o exit 1 do node e o grep nunca decide nada, o que
      # faz todo caso negativo passar pelo motivo errado. Capturar em variavel.

      # A regua continua valendo para quem NAO tem excecao, e a excecao de um card nao
      # blinda os irmaos do mesmo emissor.
      - name: Excecao nao pode blindar card sem excecao
        run: |
          set -uo pipefail
          set +e
          saida=$(METRICAS_HOJE=2027-01-15 node scripts/check-metricas-curadas.mjs 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "::error::A guarda APROVOU card de ITR vencido. A regua nao esta valendo."
            exit 1
          fi
          case "$saida" in
            *"Unidas / card 1 (Alavancagem)"*) echo "OK: a excecao do Rating nao blindou os outros cards da Unidas." ;;
            *) echo "::error::Os demais cards da Unidas nao apareceram entre as falhas. A excecao pode estar cobrindo o emissor inteiro."; exit 1 ;;
          esac

      # O buraco que este mecanismo fecha, invertido: excecao sobre card sem datacao
      # seria exatamente o silencio de novo, so que declarado.
      - name: Excecao sobre card sem trio tem que reprovar
        run: |
          set -uo pipefail
          sed 's|"Unidas / Rating": {|"Localiza / Rating": {|' scripts/check-metricas-curadas.mjs > /tmp/guarda-exc.mjs
          grep -q '"Localiza / Rating"' /tmp/guarda-exc.mjs || { echo "::error::A injecao nao entrou, o teste nao provaria nada."; exit 1; }
          set +e
          saida=$(EMISSORES_WORKER_PATH="$PWD/api/src/worker.js" METRICAS_FRONTEND_PATH="$PWD/app/index.html" node /tmp/guarda-exc.mjs 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "::error::A guarda APROVOU excecao sobre card sem datacao."; exit 1; fi
          case "$saida" in
            *excecao_sem_trio*) echo "OK: reprovou por excecao_sem_trio, como deve." ;;
            *) echo "::error::Reprovou pelo motivo errado, a regra excecao_sem_trio nao disparou."; exit 1 ;;
          esac

      # Anti-apodrecimento: card que volta para dentro da janela tem que largar a
      # excecao, senao ela fica cobrindo algo que ja nao precisa e ninguem percebe.
      - name: Excecao ociosa tem que ser acusada
        run: |
          set -uo pipefail
          sed 's|"Unidas / Rating": {|"Tupy / Rating": {|' scripts/check-metricas-curadas.mjs > /tmp/guarda-exc.mjs
          grep -q '"Tupy / Rating"' /tmp/guarda-exc.mjs || { echo "::error::A injecao nao entrou."; exit 1; }
          set +e
          saida=$(EMISSORES_WORKER_PATH="$PWD/api/src/worker.js" METRICAS_FRONTEND_PATH="$PWD/app/index.html" node /tmp/guarda-exc.mjs 2>&1)
          rc=$?
          set -e
          case "$saida" in
            *"excecao de frescor que ja nao e necessaria"*) echo "OK: acusou a excecao ociosa." ;;
            *) echo "::error::Excecao sobre card fresco passou sem aviso."; exit 1 ;;
          esac

      # Label renomeado deixa a excecao viva cobrindo nada.
      - name: Excecao orfa tem que reprovar
        run: |
          set -uo pipefail
          sed 's|"Unidas / Rating": {|"Zzqx Petroquimica / Rating": {|' scripts/check-metricas-curadas.mjs > /tmp/guarda-exc.mjs
          grep -q '"Zzqx Petroquimica / Rating"' /tmp/guarda-exc.mjs || { echo "::error::A injecao nao entrou."; exit 1; }
          set +e
          saida=$(EMISSORES_WORKER_PATH="$PWD/api/src/worker.js" METRICAS_FRONTEND_PATH="$PWD/app/index.html" node /tmp/guarda-exc.mjs 2>&1)
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "::error::A guarda APROVOU excecao apontando para card inexistente."; exit 1; fi
          case "$saida" in
            *excecao_orfa*) echo "OK: reprovou por excecao_orfa, como deve." ;;
            *) echo "::error::Reprovou pelo motivo errado."; exit 1 ;;
          esac

      # A ponta que fecha a regra 5 do CLAUDE.md aqui. Nao basta a guarda TOLERAR a
      # excecao, ela tem que NOMEAR na saida. Tolerancia silenciosa seria o buraco de
      # volta com outro nome, e passaria nas quatro etapas acima parecendo sadia.
      - name: Caso bom tem que nomear a excecao, nao so passar
        run: |
          set -uo pipefail
          set +e
          saida=$(node scripts/check-metricas-curadas.mjs 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then echo "::error::O repo como esta nao passou."; exit 1; fi
          case "$saida" in
            *"Unidas / Rating"*) echo "OK: passou e nomeou a excecao na saida." ;;
            *) echo "::error::Passou em silencio. Excecao tolerada sem aparecer e o buraco de volta."; exit 1 ;;
          esac

      # CURADORIA2, ponta negativa: emissor novo entra na carteira e ninguem decide de
      # qual companhia da CVM sai o numero dele. E o mesmo defeito do CURADORIA1 um
      # nivel acima, e o que faria a recuracao puxar dado de outra empresa em silencio.
      - name: Guarda tem que reprovar emissor sem companhia declarada
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's/(var EMISSORES_LISTA\s*=\s*\[\r?\n)/$1  "Zzqx Participacoes",\n/' \
            api/src/worker.js > /tmp/guarda/worker_nodecl.js
          if ! grep -q '"Zzqx Participacoes"' /tmp/guarda/worker_nodecl.js; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_nodecl.js node scripts/check-emissores-cnpj.mjs; then
            echo "::error::A guarda APROVOU emissor sem companhia da CVM declarada. A recuracao puxaria numero de outra empresa."
            exit 1
          fi
          echo "OK: guarda reprovou o emissor nao declarado, como deve."

      # CURADORIA2, ponta negativa 2: CNPJ bem formado mas digitado errado. Roda
      # OFFLINE de proposito, e essa e a graca: antes do SNAPSHOT_CVM so a rodada
      # agendada baixava o indice, entao uma tipografia podia ficar ate uma semana
      # no repo sem ninguem ver. A troca abaixo inverte dois digitos do CNPJ da
      # Sabesp, que e o formato de erro mais provavel de quem digita a mao.
      - name: Guarda tem que reprovar CNPJ digitado errado, sem rede
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda/cnpj
          cp scripts/check-emissores-cnpj.mjs /tmp/guarda/cnpj/
          perl -0pe 's{"Sabesp": "43\.776\.517/0001-80"}{"Sabesp": "43.776.157/0001-80"}' \
            scripts/emissores-cnpj.mjs > /tmp/guarda/cnpj/emissores-cnpj.mjs
          if ! grep -q '43\.776\.157/0001-80' /tmp/guarda/cnpj/emissores-cnpj.mjs; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH="$GITHUB_WORKSPACE/api/src/worker.js" node /tmp/guarda/cnpj/check-emissores-cnpj.mjs; then
            echo "::error::A guarda APROVOU CNPJ digitado errado sem tocar na rede. O SNAPSHOT_CVM nao esta valendo."
            exit 1
          fi
          echo "OK: guarda reprovou o CNPJ trocado offline, como deve."

      # SUBSTRINGDONO1, ponta negativa 1: CNPJ_PRIMARIO_EMISSOR no worker.js
      # divergindo do canonico. Se isto passasse despercebido, a guarda daqui
      # aprovaria o que o Worker em producao reprova, ou o contrario.
      - name: Guarda tem que reprovar CNPJ_PRIMARIO_EMISSOR divergindo do canonico
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's{"08\.827\.501/0001-58": "Aegea Saneamento",}{"08.827.501/0009-99": "Aegea Saneamento",}' \
            api/src/worker.js > /tmp/guarda/worker_cnpj_diverge.js
          if ! grep -q '0009-99' /tmp/guarda/worker_cnpj_diverge.js; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_cnpj_diverge.js node scripts/check-emissores-cnpj.mjs; then
            echo "::error::A guarda APROVOU CNPJ_PRIMARIO_EMISSOR divergindo do canonico."
            exit 1
          fi
          echo "OK: guarda reprovou a divergencia entre worker.js e o canonico, como deve."

      # SUBSTRINGDONO1, ponta negativa 2: um CNPJ que ja e PRIMARIO de um emissor
      # vazando para dentro da familia de outro. Se isto passasse, o card de balanco
      # de um emissor passaria a ler o ITR do outro.
      - name: Guarda tem que reprovar CNPJ primario vazando para a familia de outro emissor
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's{("60\.933\.603/0001-78": "Auren Energia", // CESP.*\n)}{$1  "33.592.510/0001-54": "Auren Energia", // CNPJ da Vale, injetado pelo teste\n}' \
            api/src/worker.js > /tmp/guarda/worker_familia_vaza.js
          if ! grep -q '33.592.510/0001-54": "Auren Energia"' /tmp/guarda/worker_familia_vaza.js; then
            echo "::error::A injecao do teste nao entrou no arquivo. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_familia_vaza.js node scripts/check-emissores-cnpj.mjs; then
            echo "::error::A guarda APROVOU CNPJ primario de um emissor dentro da familia de outro."
            exit 1
          fi
          echo "OK: guarda reprovou o vazamento entre familia e primario, como deve."

      # SUBSTRINGDONO1, ponta negativa 3: scripts/predictive/cnpj_emissores.json
      # divergindo do canonico, a mesma classe de erro que deixou Omega Energia e
      # TIM Brasil apontando para entidade diferente em cada tabela ate 25/08.
      - name: Guarda tem que reprovar predictiva divergindo do canonico
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('scripts/predictive/cnpj_emissores.json', 'utf8'));
            p['Omega Energia'] = { cnpj: '09.149.503/0001-06', denom: 'OMEGA GERAÇÃO S.A.', match: 'manual-cvm' };
            fs.writeFileSync('/tmp/guarda/cnpj_emissores_diverge.json', JSON.stringify(p, null, 2));
          "
          if CNPJ_PREDICTIVE_PATH=/tmp/guarda/cnpj_emissores_diverge.json node scripts/check-emissores-cnpj.mjs; then
            echo "::error::A guarda APROVOU predictiva divergindo do canonico (caso Omega Energia)."
            exit 1
          fi
          echo "OK: guarda reprovou a divergencia entre predictiva e canonico, como deve."

      # SUBSTRINGDONO1, ponta negativa 4: reproduz o buraco original do incidente.
      # Remove a CSN de CNPJ_FAMILIA_CVM, e a guarda de quarentena tem que achar o
      # CNPJ dela sozinha, pelo nome, no indice do ano.
      - name: Guarda de quarentena tem que reproduzir o buraco original da CSN
        run: |
          set -euo pipefail
          mkdir -p /tmp/guarda
          perl -0pe 's{  "33\.042\.730/0001-04": "CSN",\n}{}' \
            api/src/worker.js > /tmp/guarda/worker_sem_csn.js
          if grep -q '"33.042.730/0001-04": "CSN"' /tmp/guarda/worker_sem_csn.js; then
            echo "::error::A remocao do teste nao surtiu efeito. O teste seguinte passaria vazio."
            exit 1
          fi
          if EMISSORES_WORKER_PATH=/tmp/guarda/worker_sem_csn.js node scripts/check-cnpj-familia.mjs; then
            echo "::error::A guarda de quarentena APROVOU acervo sem o CNPJ da CSN declarado."
            exit 1
          fi
          echo "OK: guarda de quarentena reproduziu e reprovou o buraco original da CSN."

      # Confere os 98 CNPJs declarados contra o indice real do ITR, que e a unica
      # checagem que pega CNPJ digitado errado. Baixa 19 MB, entao so no agendado e no
      # disparo manual, nao a cada push. O ramo DOC/ITR esta vivo, quem esta em 404
      # desde 23/08 e o DOC/IPE (CVMURL404), sao arquivos diferentes.
      - name: Conferir os CNPJs declarados contra o ITR da CVM
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p /tmp/itr && cd /tmp/itr
          curl -sS --fail --max-time 300 -O https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/ITR/DADOS/itr_cia_aberta_2026.zip
          unzip -o -q itr_cia_aberta_2026.zip
          cd "$GITHUB_WORKSPACE"
          ITR_DIR=/tmp/itr node scripts/check-emissores-cnpj.mjs
