name: Executar Matinal Manual

on:
  workflow_dispatch:
    inputs:
      admin_senha:
        description: 'Admin senha do Worker'
        required: true
        type: string

jobs:
  matinal:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar admin_executar_matinal
        run: |
          curl -s -X POST https://radar-credito-api.prospects-intel.workers.dev \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"admin_executar_matinal\",\"admin_senha\":\"${{ inputs.admin_senha }}\"}" \
            --max-time 300 | tee result.json
          echo ""
          echo "--- RESULTADO ---"
          cat result.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('ok:', d.get('ok'))
          print('total:', d.get('total'))
          print('sucesso:', d.get('sucesso'))
          print('falhas:', d.get('falhas'))
          print('tempo_ms:', d.get('tempo_ms'))
          " 2>/dev/null || cat result.json
