# VixRadar — Canonical Production Test
# Valida a saúde de produção a cada 6h via health check anônimo (GET /).
# NOTA: o endpoint POST de análise passou a exigir JWT (401 anônimo) desde a
# reconciliação de 2026-06-01, por isso este teste usa o health check público
# GET / em vez do antigo POST de análise (que falhava sempre com 401).
#
# NOTA: listar_emissores_prioritarios top_n=104 pode retornar <104 quando
# staleness dos emissores é baixo (varredura recente). Isso NÃO indica gap de
# cobertura — use listar_todos_emissores (total:104) para validar universo.
#
# DIAGNOSTICO DE ok:false (2026-08-05, atualizado 2026-08-19): o campo `ok` do
# health depende de SETE fatores no Worker (v4.9.201, lido do bundle deployado):
#   !!RADAR_KV && !!RADAR_USAGE_EVENTS && !!RESEND_API_KEY
#   && _adminEmailOk && _sentryOk && _verificadorRealOk && _cvmFonteOk
#
# O setimo (CVMFRESCOR1) mede a idade da FONTE da CVM, nao algo nosso. Se ele
# for o unico false, o problema esta em dados.cvm.gov.br, nao no deploy nem em
# secret. Confira o Last-Modified do ipe_cia_aberta antes de caçar bug no codigo.
# Os 3 primeiros ja apareciam aqui (kv / telemetria / providers). Os 3 ultimos
# vinham no JSON como admin_email_ok / sentry_ok / verificador_ok mas NAO eram
# lidos nem impressos — entao "ok=false" nunca dizia QUAL fator caiu, e cada
# ocorrencia (30/07, 05/08) exigia recuperar o bundle via Cloudflare MCP para
# descobrir. Agora os 3 sao extraidos e citados na mensagem de erro.

name: Canonical Production Test

on:
  schedule:
    # A cada 6 horas, em minuto 15 para evitar topo-de-hora
    - cron: '15 */6 * * *'
  workflow_dispatch:

jobs:
  canonical-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health check
        id: test
        run: |
          RESPONSE=$(curl -s https://api.vixradar.com/ \
            --max-time 30 \
            -w "\n__HTTP:%{http_code}__TIME:%{time_total}__")

          HTTP=$(echo "$RESPONSE" | grep -oP '__HTTP:\K\d+')
          TIME=$(echo "$RESPONSE" | grep -oP '__TIME:\K[0-9.]+')
          BODY=$(echo "$RESPONSE" | sed 's/__HTTP:.*//')
          OK=$(echo "$BODY" | jq -r '.ok // false')
          WORKER_V=$(echo "$BODY" | jq -r '.versao // "unknown"')
          KV=$(echo "$BODY" | jq -r '.bindings.kv // false')
          RL=$(echo "$BODY" | jq -r '.bindings.rate_limiter // false')
          TEL=$(echo "$BODY" | jq -r '.bindings.telemetria // false')
          PROV=$(echo "$BODY" | jq -r '.providers_configurados // "?"')
          # Fatores restantes de _okHealth — ja vinham no JSON, nunca eram lidos.
          # tostring, NAO `// "ausente"`: o operador // do jq dispara em null E em
          # false, entao `.verificador_ok // "x"` imprimia "x" para um campo que
          # existia e valia false (visto no run 30975983230). tostring separa os
          # casos: "false" = fator caiu, "null" = campo sumiu do endpoint.
          ADMIN_EMAIL_OK=$(echo "$BODY" | jq -r '.admin_email_ok | tostring')
          SENTRY_OK=$(echo "$BODY" | jq -r '.sentry_ok | tostring')
          VERIFICADOR_OK=$(echo "$BODY" | jq -r '.verificador_ok | tostring')
          # CVMFRESCOR1 (2026-08-19): cvm_fonte_ok entrou no _okHealth. Sem ler ele
          # aqui, um apagao da fonte CVM deixaria este run vermelho com a mensagem
          # nomeando admin_email_ok/sentry_ok/verificador_ok, todos true — alarme
          # que aponta para o lugar errado e queima a confianca no proprio alarme.
          CVM_FONTE_OK=$(echo "$BODY" | jq -r '.cvm_fonte_ok | tostring')
          CVM_FONTE_IDADE=$(echo "$BODY" | jq -r '.cvm_fonte_idade_du | tostring')
          CVM_FONTE_MOTIVO=$(echo "$BODY" | jq -r '.cvm_fonte_motivo | tostring')
          # PAINELFRESCOR1 (INCIDENTE-FRESHNESS2, 03/09/2026): idade do ESTADO
          # (o que a tela mostra), nao da fonte CVM. tostring pelo mesmo motivo
          # de CVM_FONTE_OK acima: "false" = conferido e stale, "null" = sem
          # dado para conferir (nao e o mesmo caso, so "false" reprova o gate).
          PAINEL_FRESCO=$(echo "$BODY" | jq -r '.painel_fresco | tostring')
          PAINEL_IDADE_MIN=$(echo "$BODY" | jq -r '.painel_idade_min | tostring')
          PAINEL_REGRA=$(echo "$BODY" | jq -r '.painel_regra // "?"')
          PAINEL_ATUALIZADO_EM=$(echo "$BODY" | jq -r '.painel_atualizado_em // "?"')
          PAINEL_EXIGIDO_DESDE=$(echo "$BODY" | jq -r '.painel_exigido_desde // "?"')

          echo "http=$HTTP" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "ok=$OK" >> $GITHUB_OUTPUT
          echo "worker_v=$WORKER_V" >> $GITHUB_OUTPUT
          echo "kv=$KV" >> $GITHUB_OUTPUT
          echo "rate_limiter=$RL" >> $GITHUB_OUTPUT
          echo "telemetria=$TEL" >> $GITHUB_OUTPUT
          echo "providers=$PROV" >> $GITHUB_OUTPUT
          echo "admin_email_ok=$ADMIN_EMAIL_OK" >> $GITHUB_OUTPUT
          echo "sentry_ok=$SENTRY_OK" >> $GITHUB_OUTPUT
          echo "verificador_ok=$VERIFICADOR_OK" >> $GITHUB_OUTPUT
          echo "cvm_fonte_ok=$CVM_FONTE_OK" >> $GITHUB_OUTPUT
          echo "cvm_fonte_idade=$CVM_FONTE_IDADE" >> $GITHUB_OUTPUT
          echo "cvm_fonte_motivo=$CVM_FONTE_MOTIVO" >> $GITHUB_OUTPUT
          echo "painel_fresco=$PAINEL_FRESCO" >> $GITHUB_OUTPUT
          echo "painel_idade_min=$PAINEL_IDADE_MIN" >> $GITHUB_OUTPUT
          echo "painel_regra=$PAINEL_REGRA" >> $GITHUB_OUTPUT
          echo "painel_atualizado_em=$PAINEL_ATUALIZADO_EM" >> $GITHUB_OUTPUT
          echo "painel_exigido_desde=$PAINEL_EXIGIDO_DESDE" >> $GITHUB_OUTPUT

          echo "### Resultado"
          echo "HTTP: $HTTP (${TIME}s)"
          echo "ok: $OK | Worker: $WORKER_V"
          echo "bindings: kv=$KV rate_limiter=$RL telemetria=$TEL"
          echo "providers_configurados: $PROV"
          echo "fatores: admin_email_ok=$ADMIN_EMAIL_OK sentry_ok=$SENTRY_OK verificador_ok=$VERIFICADOR_OK"
          echo "fonte CVM: ok=$CVM_FONTE_OK idade_du=$CVM_FONTE_IDADE motivo=$CVM_FONTE_MOTIVO"
          echo "fatores de ok: admin_email_ok=$ADMIN_EMAIL_OK sentry_ok=$SENTRY_OK verificador_ok=$VERIFICADOR_OK"
          echo "painel (o que a tela mostra): fresco=$PAINEL_FRESCO idade_min=$PAINEL_IDADE_MIN regra=$PAINEL_REGRA atualizado_em=$PAINEL_ATUALIZADO_EM exigido_desde=$PAINEL_EXIGIDO_DESDE"

      - name: Validate health
        run: |
          HTTP="${{ steps.test.outputs.http }}"
          OK="${{ steps.test.outputs.ok }}"
          WORKER_V="${{ steps.test.outputs.worker_v }}"
          KV="${{ steps.test.outputs.kv }}"
          RL="${{ steps.test.outputs.rate_limiter }}"
          TEL="${{ steps.test.outputs.telemetria }}"
          ADMIN_EMAIL_OK="${{ steps.test.outputs.admin_email_ok }}"
          SENTRY_OK="${{ steps.test.outputs.sentry_ok }}"
          VERIFICADOR_OK="${{ steps.test.outputs.verificador_ok }}"
          CVM_FONTE_OK="${{ steps.test.outputs.cvm_fonte_ok }}"
          CVM_FONTE_IDADE="${{ steps.test.outputs.cvm_fonte_idade }}"
          CVM_FONTE_MOTIVO="${{ steps.test.outputs.cvm_fonte_motivo }}"
          PAINEL_FRESCO="${{ steps.test.outputs.painel_fresco }}"
          PAINEL_IDADE_MIN="${{ steps.test.outputs.painel_idade_min }}"
          PAINEL_REGRA="${{ steps.test.outputs.painel_regra }}"
          PAINEL_EXIGIDO_DESDE="${{ steps.test.outputs.painel_exigido_desde }}"

          # Fonte de verdade do repo: api/wrangler.toml (main = "vX.Y.Z.js").
          # Deriva a versão esperada em vez de hardcode — o guard passa a comparar
          # produção viva contra o repo, que é a definição exata de drift. Assim
          # não há um segundo ponto de sincronização manual (o antigo EXPECTED_WORKER).
          MAIN_JS=$(grep -oP '^\s*main\s*=\s*"\K[^"]+' api/wrangler.toml | head -1)
          EXPECTED_WORKER="${MAIN_JS%.js}"
          FAIL=0

          if [ -z "$EXPECTED_WORKER" ]; then
            echo "::error::Não consegui derivar a versão esperada de api/wrangler.toml (main)."
            FAIL=1
          fi

          if [ "$HTTP" != "200" ]; then
            echo "::error::HTTP esperado 200, recebido $HTTP"
            FAIL=1
          fi

          # ok = kv && telemetria && resend && admin_email_ok && sentry_ok &&
          #      verificador_ok && cvm_fonte_ok (CVMFRESCOR1, 2026-08-19).
          # Os 3 primeiros ja tem guard proprio abaixo; cita os 4 ultimos aqui para
          # que a mensagem nomeie o fator que caiu em vez de so dizer "degradada".
          if [ "$OK" != "true" ]; then
            echo "::error::Health ok=$OK — fatores: admin_email_ok=$ADMIN_EMAIL_OK sentry_ok=$SENTRY_OK verificador_ok=$VERIFICADOR_OK cvm_fonte_ok=$CVM_FONTE_OK (kv/telemetria/resend validados nos guards abaixo). Fator false = secret ausente/malformado no Worker (ADMIN_EMAIL, SENTRY_DSN), verificador degradado, ou fonte CVM parada."
            FAIL=1
          fi

          # CVMFRESCOR1: quando o unico fator caido e a fonte CVM, o problema NAO
          # esta no deploy nem em secret nosso, esta em dados.cvm.gov.br. Dizer
          # isso explicitamente evita a caca ao bug errada que custou 5 dias de
          # feed congelado entre 14 e 19/08.
          if [ "$CVM_FONTE_OK" = "false" ]; then
            echo "::error::Fonte CVM parada ha ${CVM_FONTE_IDADE} dias uteis (motivo: ${CVM_FONTE_MOTIVO}). Ingestao cega: as rotinas continuam rodando e o modelo passa a re-narrar o mesmo fato todo dia. Confira o Last-Modified de https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ipe_cia_aberta_2026.zip antes de procurar bug no codigo."
          fi
          if [ "$CVM_FONTE_OK" = "null" ]; then
            echo "::error::Campo cvm_fonte_ok sumiu do health. O gate de frescor da fonte CVM foi removido ou o deploy regrediu para antes do v4.9.201."
            FAIL=1
          fi

          # PAINELFRESCOR1 (INCIDENTE-FRESHNESS2, 03/09/2026): reprova quando o
          # ESTADO (o que a tela mostra) esta fora do SLA da propria agenda das
          # rotinas - nao confundir com CVM_FONTE_OK acima (frescor da FONTE,
          # nao do painel). Este e o gate que teria pego o incidente de 02/09
          # (painel preso em 11:09 BRT por 12h41 com ok:true o tempo todo): so
          # nao reprova quando "null" (sem dado nenhum para conferir, diferente
          # de "conferido e stale"). O alerta da MESMA noite continua sendo o
          # do retry local (Send-VixRoutineAlert em run_claude_routine.ps1); este
          # gate e o primeiro sinal do lado servidor, ate 6h depois do prazo.
          if [ "$PAINEL_FRESCO" = "false" ]; then
            echo "::error::Painel desatualizado: idade=${PAINEL_IDADE_MIN}min, exigido pela regra '${PAINEL_REGRA}' desde ${PAINEL_EXIGIDO_DESDE}. A rotina que deveria ter escrito nao entregou (confira logs/routines/vixradar-noturno_*.log e retry-vixradar-noturno_*.log) - nao e frescor de fonte externa (isso e cvm_fonte_ok, canal separado)."
            FAIL=1
          fi

          if [ "$KV" != "true" ]; then
            echo "::error::Binding RADAR_KV ausente (kv=$KV)"
            FAIL=1
          fi

          # Telemetria é regra inviolável do projeto (binding RADAR_USAGE_EVENTS).
          if [ "$TEL" != "true" ]; then
            echo "::error::Binding de telemetria ausente (telemetria=$TEL) — painel de Engajamento cego"
            FAIL=1
          fi

          if [ "$RL" != "true" ]; then
            # AUDITORIA-15AGO (RLGATE1): era ::warning::, o que mantinha o run
            # verde com rate limiter quebrado em prod — mesmo padrao do drift
            # v4.9.143 (warning ignorado por ~12 dias). health.test.mjs ja exige
            # rate_limiter=true; o gate de CI passa a exigir tambem.
            echo "::error::Binding rate_limiter=$RL (esperado true) — DO de rate limit ausente/degradado"
            FAIL=1
          fi

          # GUARD ANTI-DRIFT: falha (não só avisa). O warning anterior foi ignorado
          # por ~12 dias / ~47 runs (drift v4.9.143), porque ::warning:: mantém o run
          # verde e o GitHub só notifica em FALHA. Falhar inverte o ônus: run vermelho
          # + email automático ao dono até o drift ser reconciliado. Ver Obsidian 25/26.
          if [ "$WORKER_V" != "$EXPECTED_WORKER" ]; then
            echo "::error::DRIFT prod/repo. Produção=$WORKER_V vs repo (api/wrangler.toml main)=$EXPECTED_WORKER. Reconcilie: recupere o bundle deployado via Cloudflare MCP, commite api/<versao>.js e aponte wrangler.toml main. NÃO deploye do repo até reconciliar (regrediria produção)."
            FAIL=1
          fi

          # ── Frontend drift detection ─────────────────────────────────
          EXPECTED_FRONTEND=$(jq -r '.version // "unknown"' app/version.json)
          FRONTEND_JSON=$(curl -s https://vixradar.com/version.json --max-time 15)
          PROD_FRONTEND=$(echo "$FRONTEND_JSON" | jq -r '.version // "unknown"')

          if [ "$PROD_FRONTEND" != "$EXPECTED_FRONTEND" ]; then
            echo "::error::DRIFT frontend prod/repo. Produção=$PROD_FRONTEND vs repo (app/version.json)=$EXPECTED_FRONTEND"
            FAIL=1
          fi

          # Confirma que o HTML servido declara o mesmo CACHE_VERSION.
          # head -1: a página declara CACHE_VERSION duas vezes (const CACHE_VERSION="..."
          # e window.CACHE_VERSION="..."), então o grep sem head produzia um valor
          # multi-linha que nunca batia com $EXPECTED_FRONTEND (falso positivo mesmo
          # com produção e repo idênticos — visto em 2026-07-08/09/10).
          PROD_HTML_CV=$(curl -s https://vixradar.com/ --max-time 15 | grep -oP 'CACHE_VERSION\s*=\s*"\K[^"]+' | head -1)
          if [ "$PROD_HTML_CV" != "$EXPECTED_FRONTEND" ]; then
            echo "::error::DRIFT CACHE_VERSION no HTML. Produção=$PROD_HTML_CV vs esperado=$EXPECTED_FRONTEND"
            FAIL=1
          fi
          echo "Frontend: produção=$PROD_FRONTEND repo=$EXPECTED_FRONTEND CACHE_VERSION=$PROD_HTML_CV"

          if [ "$FAIL" = "1" ]; then
            echo "Health check FALHOU."
            exit 1
          fi
          echo "Produção saudável."
