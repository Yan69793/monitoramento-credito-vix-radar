name: Frescor da Ingestao

on:
  workflow_dispatch:
    inputs:
      admin_senha:
        description: 'Senha admin do Worker (vazio usa ADMIN_PASSWORD)'
        required: false
        type: string
  schedule:
    - cron: '37 1 * * *'

permissions:
  contents: read

concurrency:
  group: frescor-ingestao
  cancel-in-progress: false

jobs:
  frescor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar frescor
        env:
          SECRET_PWD: ${{ secrets.ADMIN_PASSWORD }}
          INPUT_PWD: ${{ inputs.admin_senha }}
        shell: bash
        run: |
          set -euo pipefail
          admin_pwd="${SECRET_PWD:-${INPUT_PWD:-}}"
          if [[ -z "$admin_pwd" ]]; then
            echo "::error::ADMIN_PASSWORD ausente e input vazio."
            exit 1
          fi
          echo "::add-mask::$admin_pwd"

          body_health=$(jq -n --arg pw "$admin_pwd" '{action:"admin_health_check",admin_senha:$pw}')
          hc=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body_health" --max-time 60)
          echo "$hc" | jq -e '.ok == true' >/dev/null
          echo "$hc" | jq '{ok,versao,empresas_com_dados:.checks.estado_semanal.empresas_com_dados,updated_at:.checks.estado_semanal.updated_at,weeks_loaded:.checks.estado_semanal.weeks_loaded,evento_mais_novo:.checks.evento_mais_novo}'

          body_cost=$(jq -n --arg pw "$admin_pwd" '{action:"admin_custo",admin_senha:$pw}')
          cost=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body_cost" --max-time 60)
          echo "$cost" | jq -e 'type == "object"' >/dev/null
          echo "$cost" | jq '{data,resumo,disjuntor_usd}'

          companies=$(echo "$hc" | jq -er '.checks.estado_semanal.empresas_com_dados')
          updated=$(echo "$hc" | jq -er '.checks.estado_semanal.updated_at')
          [[ "$companies" =~ ^[0-9]+$ ]] || { echo "::error::Cobertura invalida: $companies"; exit 1; }
          (( companies >= 50 )) || { echo "::error::Cobertura baixa: $companies/103"; exit 1; }

          updated_epoch=$(date -d "$updated" +%s)
          now_epoch=$(date +%s)
          (( updated_epoch <= now_epoch + 300 )) || { echo "::error::updated_at esta no futuro: $updated"; exit 1; }
          age_h=$(( (now_epoch - updated_epoch) / 3600 ))
          (( age_h <= 48 )) || { echo "::error::Estado stale ha ${age_h}h"; exit 1; }

          # EVENTOFRESCOR1 (2026-08-19). Tudo acima mede se o ESCRITOR rodou, nao
          # se o dado e novo: `updated_at` e a hora da gravacao e `companies` e a
          # contagem de emissores tocados. A rotina escreve todo dia, entao os
          # dois ficaram verdes a semana inteira enquanto o feed estava congelado
          # em 14/08 com o modelo re-narrando o mesmo fato. Este Action passou
          # verde o incidente todo e foi por isso que ninguem viu.
          # O gate abaixo mede a idade do EVENTO mais novo, que e o que aparece
          # na tela do usuario. Campo servido por checks.evento_mais_novo desde o
          # Worker v4.9.203.
          ev_data=$(echo "$hc" | jq -r '.checks.evento_mais_novo.data // "null"')
          ev_idade=$(echo "$hc" | jq -r '.checks.evento_mais_novo.idade_du // "null"')
          ev_limite=$(echo "$hc" | jq -r '.checks.evento_mais_novo.limite_du // "null"')
          ev_total=$(echo "$hc" | jq -r '.checks.evento_mais_novo.total_eventos // "null"')

          if [[ "$ev_idade" == "null" ]]; then
            echo "::error::checks.evento_mais_novo ausente ou sem data. Ou o Worker regrediu para antes do v4.9.203, ou nao existe UM evento datado no estado inteiro."
            exit 1
          fi

          if (( ev_idade > ev_limite )); then
            echo "::error::INGESTAO PARADA. Evento mais novo e de ${ev_data}, ${ev_idade} dias uteis atras (limite ${ev_limite}), com ${ev_total} eventos no estado. As rotinas podem estar rodando e gravando normalmente, o que este gate mede e se entrou fato NOVO, nao se alguem escreveu. CVMCADENCIA1 (2026-08-20): NAO culpe a CVM por reflexo. O ramo CIA_ABERTA/DOC tem cadencia SEMANAL declarada e publica aos domingos, entao fonte com 4 dias uteis e normal e nao explica evento parado, ja que a maior parte dos eventos vem de imprensa e rating, que publicam todo dia util. Confira nesta ordem: 1) logs em logs/routines do dia, linha FIM com submit_ok; 2) fonte_externa_ok no health publico, que so vai a false apos DOIS ciclos semanais perdidos, e ai sim a fonte parou de verdade; 3) fila de verificacao radar:verif_fila."
            exit 1
          fi

          # CVMDURA1 / HEALTHWATCH3 (2026-08-24). Ate aqui nada neste workflow
          # olhava a FONTE, so o resultado dela. Em 23/08 o ZIP do ano corrente
          # da CVM sumiu do servidor (404) e a ingestao de fato relevante morreu,
          # mas o gate de evento acima levou 6 dias para acusar porque o fim de
          # semana nao conta dia util e o limite e 2. O unico canal que cobria
          # a fonte era o watch-vixradar-health.ps1, desligado em 21/08.
          # Este bloco fecha o buraco e roda na nuvem, sem depender da maquina
          # local. A mensagem nomeia o campo especifico: alerta que so repete
          # "ok=false" treina o operador a ignorar.
          pub=$(curl --fail-with-body -sS 'https://api.vixradar.com/' --max-time 60)
          cvm_dura=$(echo "$pub" | jq -r '.cvm_fonte_falha_dura // false')
          cvm_degrada=$(echo "$pub" | jq -r '.cvm_fonte_degrada_servico // false')
          cvm_motivo=$(echo "$pub" | jq -r '.cvm_fonte_motivo // "ausente"')
          cvm_falhas=$(echo "$pub" | jq -r '.cvm_fonte_falhas_consecutivas // 0')
          cvm_idade=$(echo "$pub" | jq -r '.cvm_fonte_idade_dias // "null"')
          cvm_ok_em=$(echo "$pub" | jq -r '.cvm_fonte_ultimo_sync_ok_em // "null"')

          if [[ "$cvm_degrada" == "true" ]]; then
            echo "::error::FONTE CVM MORTA. cvm_fonte_motivo=${cvm_motivo} falhas_consecutivas=${cvm_falhas} idade_dias=${cvm_idade} ultimo_sync_ok_em=${cvm_ok_em}. Isto NAO e cadencia semanal (CVMCADENCIA1): e falha dura de fetch repetida, o Worker nao consegue baixar o arquivo. Confira a URL viva em https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ e o catalogo em https://dados.cvm.gov.br/api/3/action/package_show?id=cia_aberta-doc-ipe antes de mexer em rotina."
            exit 1
          fi
          if [[ "$cvm_dura" == "true" ]]; then
            echo "::warning::Fonte CVM com falha dura recente. cvm_fonte_motivo=${cvm_motivo} falhas_consecutivas=${cvm_falhas} idade_dias=${cvm_idade}. Ainda abaixo do limite de escalada, mas se repetir a ingestao de fato relevante para."
          fi

          echo "FRESCOR_OK empresas=$companies idade_h=$age_h evento_mais_novo=$ev_data idade_du=$ev_idade eventos=$ev_total cvm_motivo=$cvm_motivo cvm_falhas=$cvm_falhas"