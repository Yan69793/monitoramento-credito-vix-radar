name: Frescor da Ingestao

on:
  workflow_dispatch:
    inputs:
      admin_senha:
        description: 'Senha admin do Worker (vazio usa ADMIN_PASSWORD)'
        required: false
        type: string
  schedule:
    - cron: '37 1 * * *'

permissions:
  contents: read

concurrency:
  group: frescor-ingestao
  cancel-in-progress: false

jobs:
  frescor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar frescor
        env:
          SECRET_PWD: ${{ secrets.ADMIN_PASSWORD }}
          INPUT_PWD: ${{ inputs.admin_senha }}
        shell: bash
        run: |
          set -euo pipefail
          admin_pwd="${SECRET_PWD:-${INPUT_PWD:-}}"
          if [[ -z "$admin_pwd" ]]; then
            echo "::error::ADMIN_PASSWORD ausente e input vazio."
            exit 1
          fi
          echo "::add-mask::$admin_pwd"

          body_health=$(jq -n --arg pw "$admin_pwd" '{action:"admin_health_check",admin_senha:$pw}')
          hc=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body_health" --max-time 60)
          echo "$hc" | jq -e '.ok == true' >/dev/null
          echo "$hc" | jq '{ok,versao,empresas_com_dados:.checks.estado_semanal.empresas_com_dados,updated_at:.checks.estado_semanal.updated_at,weeks_loaded:.checks.estado_semanal.weeks_loaded,evento_mais_novo:.checks.evento_mais_novo}'

          body_cost=$(jq -n --arg pw "$admin_pwd" '{action:"admin_custo",admin_senha:$pw}')
          cost=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' \
            -H 'Content-Type: application/json' -d "$body_cost" --max-time 60)
          echo "$cost" | jq -e 'type == "object"' >/dev/null
          echo "$cost" | jq '{data,resumo,disjuntor_usd}'

          companies=$(echo "$hc" | jq -er '.checks.estado_semanal.empresas_com_dados')
          updated=$(echo "$hc" | jq -er '.checks.estado_semanal.updated_at')
          [[ "$companies" =~ ^[0-9]+$ ]] || { echo "::error::Cobertura invalida: $companies"; exit 1; }
          (( companies >= 50 )) || { echo "::error::Cobertura baixa: $companies/103"; exit 1; }

          updated_epoch=$(date -d "$updated" +%s)
          now_epoch=$(date +%s)
          (( updated_epoch <= now_epoch + 300 )) || { echo "::error::updated_at esta no futuro: $updated"; exit 1; }
          age_h=$(( (now_epoch - updated_epoch) / 3600 ))
          (( age_h <= 48 )) || { echo "::error::Estado stale ha ${age_h}h"; exit 1; }

          # EVENTOFRESCOR1 (2026-08-19). Tudo acima mede se o ESCRITOR rodou, nao
          # se o dado e novo: `updated_at` e a hora da gravacao e `companies` e a
          # contagem de emissores tocados. A rotina escreve todo dia, entao os
          # dois ficaram verdes a semana inteira enquanto o feed estava congelado
          # em 14/08 com o modelo re-narrando o mesmo fato. Este Action passou
          # verde o incidente todo e foi por isso que ninguem viu.
          # O gate abaixo mede a idade do EVENTO mais novo, que e o que aparece
          # na tela do usuario. Campo servido por checks.evento_mais_novo desde o
          # Worker v4.9.203.
          ev_data=$(echo "$hc" | jq -r '.checks.evento_mais_novo.data // "null"')
          ev_idade=$(echo "$hc" | jq -r '.checks.evento_mais_novo.idade_du // "null"')
          ev_limite=$(echo "$hc" | jq -r '.checks.evento_mais_novo.limite_du // "null"')
          ev_total=$(echo "$hc" | jq -r '.checks.evento_mais_novo.total_eventos // "null"')

          if [[ "$ev_idade" == "null" ]]; then
            echo "::error::checks.evento_mais_novo ausente ou sem data. Ou o Worker regrediu para antes do v4.9.203, ou nao existe UM evento datado no estado inteiro."
            exit 1
          fi

          # AVANCOFEED1 (2026-09-01). A decisao passou de "N dias uteis sem
          # evento" para "a fonte andou e o feed nao?".
          #
          # O gate de idade abaixo era ERRO ate aqui e reprovaria o estado de
          # 02/09/2026, que e saudavel: medido em 01/09, o teto do acervo da CVM
          # era 2026-08-28, exatamente igual ao evento mais novo do feed. O lote
          # semanal publicado no domingo 30/08 so carrega documento ate a sexta
          # 28/08 e o proximo sai em 06/09, entao nao havia fato para persistir.
          # Reprovar ali seria ensinar o operador a ignorar o alarme, que e como
          # o CVMURL404 passou quatro dias invisivel.
          #
          # A idade continua sendo medida e continua aparecendo, agora como
          # WARNING: a maior parte dos eventos vem de imprensa e rating, que
          # publicam todo dia util, entao feed longo sem andar segue merecendo
          # olhada mesmo com a CVM no teto. O que ela deixou de fazer e reprovar
          # sozinha.
          if (( ev_idade > ev_limite )); then
            echo "::warning::Feed sem evento novo ha ${ev_idade} dias uteis (limite ${ev_limite}), mais novo em ${ev_data}, ${ev_total} eventos no estado. Isoladamente isto NAO reprova: quem decide e checks.avanco_feed abaixo. Se ele disser saudavel_sem_fato_novo, a fonte tambem esta parada no mesmo teto e nao ha fato para persistir."
          fi

          # Guarda de AVANCO. Compara o teto do feed com o teto da fonte e com a
          # cadencia esperada dela, e so reprova quando a fonte andou e o feed
          # ficou para tras com o pipeline ja tendo escrito depois do lote.
          # Servida por checks.avanco_feed desde o Worker v4.9.229.
          av_estado=$(echo "$hc" | jq -r '.checks.avanco_feed.estado // "ausente"')
          av_alerta=$(echo "$hc" | jq -r '.checks.avanco_feed.alerta // "null"')
          av_diag=$(echo "$hc" | jq -r '.checks.avanco_feed.diagnostico // ""')
          av_feed=$(echo "$hc" | jq -r '.checks.avanco_feed.feed_max_data_evento // "null"')
          av_teto=$(echo "$hc" | jq -r '.checks.avanco_feed.teto_comparavel // "null"')
          av_ent=$(echo "$hc" | jq -r '.checks.avanco_feed.fonte_max_data_entrega // "null"')
          av_cad=$(echo "$hc" | jq -r '.checks.avanco_feed.fonte_dentro_da_cadencia // "null"')
          av_esc=$(echo "$hc" | jq -r '.checks.avanco_feed.pipeline_escreveu_apos_lote // "null"')
          av_lote=$(echo "$hc" | jq -r '.checks.avanco_feed.referencia_lote // "null"')
          av_prox=$(echo "$hc" | jq -r '.checks.avanco_feed.fonte_proxima_prevista // "null"')

          if [[ "$av_estado" == "ausente" ]]; then
            echo "::error::checks.avanco_feed ausente na resposta. O Worker regrediu para antes do v4.9.229, e a guarda de avanco do feed nao esta sendo avaliada."
            exit 1
          fi

          echo "AVANCO_FEED estado=${av_estado} feed_max=${av_feed} teto_fonte=${av_teto} max_data_entrega=${av_ent} dentro_da_cadencia=${av_cad} escreveu_apos_lote=${av_esc} referencia_lote=${av_lote} proxima_prevista=${av_prox}"

          if [[ "$av_alerta" == "true" ]]; then
            echo "::error::AVANCO DO FEED REPROVADO (${av_estado}). feed_max=${av_feed} teto_fonte=${av_teto} max_data_entrega=${av_ent} fonte_dentro_da_cadencia=${av_cad} pipeline_escreveu_apos_lote=${av_esc} referencia_lote=${av_lote}. ${av_diag}"
            exit 1
          fi

          if [[ "$av_estado" == "fonte_parada" ]]; then
            echo "::warning::Feed no teto da fonte, mas a FONTE esta fora da cadencia esperada. Isto nao e falha de pipeline e por isso nao reprova aqui: quem decide e cvm_fonte_degrada_servico, no bloco CVMDURA1 abaixo. ${av_diag}"
          fi

          # CVMDURA1 / HEALTHWATCH3 (2026-08-24). Ate aqui nada neste workflow
          # olhava a FONTE, so o resultado dela. Em 23/08 o ZIP do ano corrente
          # da CVM sumiu do servidor (404) e a ingestao de fato relevante morreu,
          # mas o gate de evento acima levou 6 dias para acusar porque o fim de
          # semana nao conta dia util e o limite e 2. O unico canal que cobria
          # a fonte era o watch-vixradar-health.ps1, desligado em 21/08.
          # Este bloco fecha o buraco e roda na nuvem, sem depender da maquina
          # local. A mensagem nomeia o campo especifico: alerta que so repete
          # "ok=false" treina o operador a ignorar.
          pub=$(curl --fail-with-body -sS 'https://api.vixradar.com/' --max-time 60)
          cvm_dura=$(echo "$pub" | jq -r '.cvm_fonte_falha_dura // false')
          cvm_degrada=$(echo "$pub" | jq -r '.cvm_fonte_degrada_servico // false')
          cvm_motivo=$(echo "$pub" | jq -r '.cvm_fonte_motivo // "ausente"')
          cvm_falhas=$(echo "$pub" | jq -r '.cvm_fonte_falhas_consecutivas // 0')
          cvm_idade=$(echo "$pub" | jq -r '.cvm_fonte_idade_dias // "null"')
          cvm_ok_em=$(echo "$pub" | jq -r '.cvm_fonte_ultimo_sync_ok_em // "null"')

          if [[ "$cvm_degrada" == "true" ]]; then
            echo "::error::FONTE CVM MORTA. cvm_fonte_motivo=${cvm_motivo} falhas_consecutivas=${cvm_falhas} idade_dias=${cvm_idade} ultimo_sync_ok_em=${cvm_ok_em}. Isto NAO e cadencia semanal (CVMCADENCIA1): e falha dura de fetch repetida, o Worker nao consegue baixar o arquivo. Confira a URL viva em https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/IPE/DADOS/ e o catalogo em https://dados.cvm.gov.br/api/3/action/package_show?id=cia_aberta-doc-ipe antes de mexer em rotina."
            exit 1
          fi
          if [[ "$cvm_dura" == "true" ]]; then
            echo "::warning::Fonte CVM com falha dura recente. cvm_fonte_motivo=${cvm_motivo} falhas_consecutivas=${cvm_falhas} idade_dias=${cvm_idade}. Ainda abaixo do limite de escalada, mas se repetir a ingestao de fato relevante para."
          fi

          echo "FRESCOR_OK empresas=$companies idade_h=$age_h evento_mais_novo=$ev_data idade_du=$ev_idade eventos=$ev_total avanco_feed=$av_estado teto_fonte=$av_teto cvm_motivo=$cvm_motivo cvm_falhas=$cvm_falhas"

      # FRESCORNOTIFY1 (auditoria 2026-08-29): ate aqui o gate reprovava mas o
      # aviso morria dentro do GitHub, sem canal nenhum (28/08 e 29/08 o operador
      # so ficou sabendo por leitura manual do log). Passo de alerta pelo mesmo
      # canal do watch-vixradar-health.ps1: action=notificar_rotina com dedup do
      # Worker por rotina/dia (NOTIFYRL1), no maximo 1 email por dia. Roda so em
      # falha (if: failure). Re-deriva o detalhe do admin_health_check para
      # nomear a causa (HEALTHWATCH3: alerta que nao diz o que quebrou ensina a
      # ignorar).
      - name: Notificar queda de frescor
        if: failure()
        env:
          ROUTINE_KEY: ${{ secrets.ROUTINE_API_KEY }}
          SECRET_PWD: ${{ secrets.ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROUTINE_KEY:-}" ]]; then
            echo "::error::ROUTINE_API_KEY ausente nos secrets; alerta de frescor nao enviado."
            exit 0
          fi
          det="sem detalhe"
          if [[ -n "${SECRET_PWD:-}" ]]; then
            body=$(jq -n --arg pw "$SECRET_PWD" '{action:"admin_health_check",admin_senha:$pw}')
            # AVANCOFEED1: o detalhe agora nomeia o estado da guarda de avanco e
            # os dois tetos comparados. "evento mais novo e de X" sozinho nao
            # diz se a fonte tinha algo para dar, que e a metade acionavel.
            det=$(curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' -H 'Content-Type: application/json' -d "$body" --max-time 60 \
              | jq -r '"avanco_feed=" + (.checks.avanco_feed.estado // "ausente") + " feed_max=" + (.checks.avanco_feed.feed_max_data_evento // "null") + " teto_fonte=" + (.checks.avanco_feed.teto_comparavel // "null") + " dentro_da_cadencia=" + (.checks.avanco_feed.fonte_dentro_da_cadencia|tostring) + " escreveu_apos_lote=" + (.checks.avanco_feed.pipeline_escreveu_apos_lote|tostring) + " | evento_mais_novo=" + (.checks.evento_mais_novo.data // "null") + " idade_du=" + (.checks.evento_mais_novo.idade_du|tostring) + " | " + (.checks.avanco_feed.diagnostico // "")' 2>/dev/null || echo "sem campo avanco_feed na resposta")
          fi
          run_url="https://github.com/Yan69793/monitoramento-credito-vix-radar/actions/runs/${GITHUB_RUN_ID}"
          motivo="Frescor da ingestao reprovou as $(date -u +%H:%MZ) UTC. Detalhe: ${det}. Log: ${run_url}"
          html="<h2>VIX Radar - frescor da ingestao reprovado</h2><p>${det}</p><p>Run: <a href=\"${run_url}\">ver log completo</a></p>"
          nbody=$(jq -n --arg rk "$ROUTINE_KEY" --arg rot "frescor-ingestao" --arg motivo "$motivo" --arg html "$html" \
            '{action:"notificar_rotina",routine_key:$rk,rotina:$rot,motivo:$motivo,html:$html}')
          curl --fail-with-body -sS -X POST 'https://api.vixradar.com/' -H 'Content-Type: application/json' -d "$nbody" --max-time 30 >/dev/null \
            && echo "Alerta de frescor enviado" \
            || echo "Falha ao enviar alerta de frescor"