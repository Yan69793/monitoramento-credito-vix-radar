# VixRadar — Verificação de Frescor da Ingestão
# Responde "as notícias estão atualizadas?" sem precisar de acesso direto à
# produção: o GitHub Actions alcança api.vixradar.com (fora do bloqueio de
# egresso das sessões Cowork) e consulta endpoints admin de leitura.
#
# Auth: usa o secret ADMIN_PASSWORD se configurado no repo; senão, aceita a
# senha como input (digitada na hora pela UI do GitHub). A senha é MASCARADA
# no log (::add-mask::) antes de qualquer uso — nunca aparece em texto claro.
#
# Endpoints consultados (somente leitura, NÃO disparam varredura/custo):
#   - admin_health_check → estado_semanal.empresas_com_dados + updated_at
#   - admin_custo        → gasto do dia (prova que análises rodaram hoje)

name: Frescor da Ingestao

on:
  workflow_dispatch:
    inputs:
      admin_senha:
        description: 'Senha admin do Worker (deixe vazio se ADMIN_PASSWORD estiver nos secrets)'
        required: false
        type: string
  schedule:
    # 01:37 UTC = 22:37 BRT, após o cron noturno (21:30 UTC). Roda sozinho
    # quando o secret ADMIN_PASSWORD existir; sem o secret, sai limpo (exit 0).
    - cron: '37 1 * * *'

jobs:
  frescor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar frescor
        env:
          SECRET_PWD: ${{ secrets.ADMIN_PASSWORD }}
          INPUT_PWD: ${{ inputs.admin_senha }}
        run: |
          PWD="${SECRET_PWD:-$INPUT_PWD}"
          if [ -z "$PWD" ]; then
            echo "::warning::Sem senha disponivel (secret ADMIN_PASSWORD ausente e input vazio)."
            echo "Configure o secret ADMIN_PASSWORD em Settings -> Secrets and variables -> Actions"
            echo "para que o agendamento rode sozinho. Saindo limpo (sem falha)."
            exit 0
          fi
          # Mascarar a senha no log antes de qualquer uso
          echo "::add-mask::$PWD"

          API="https://api.vixradar.com"

          echo "=== 1) admin_health_check (estado semanal / frescor) ==="
          BODY1=$(jq -n --arg pw "$PWD" '{action:"admin_health_check",admin_senha:$pw}')
          HC=$(curl -s -X POST "$API/" \
            -H "Content-Type: application/json" \
            -d "$BODY1" \
            --max-time 60)
          echo "$HC" | jq '{
            ok: .ok,
            versao: .versao,
            empresas_com_dados: .checks.estado_semanal.empresas_com_dados,
            updated_at: .checks.estado_semanal.updated_at,
            weeks_loaded: .checks.estado_semanal.weeks_loaded,
            anthropic: .checks.anthropic,
            resend: .checks.resend,
            telemetria: .checks.telemetria
          }' 2>/dev/null || echo "$HC"

          echo ""
          echo "=== 2) admin_custo (gasto de hoje — prova de análise no dia) ==="
          BODY2=$(jq -n --arg pw "$PWD" '{action:"admin_custo",admin_senha:$pw}')
          CT=$(curl -s -X POST "$API/" \
            -H "Content-Type: application/json" \
            -d "$BODY2" \
            --max-time 60)
          echo "$CT" | jq '{ data: .data, resumo: .resumo, disjuntor_usd: .disjuntor_usd }' 2>/dev/null || echo "$CT"

          echo ""
          echo "=== Leitura rápida ==="
          EMP=$(echo "$HC" | jq -r '.checks.estado_semanal.empresas_com_dados // "null"' 2>/dev/null)
          UPD=$(echo "$HC" | jq -r '.checks.estado_semanal.updated_at // "null"' 2>/dev/null)
          echo "Emissores com dados (de 103): $EMP"
          echo "Última atualização do estado: $UPD"

          if echo "$HC" | jq -e '.ok == false' >/dev/null 2>&1; then
            echo "::error::admin_health_check retornou ok:false ou acesso negado — verifique o secret ADMIN_PASSWORD."
            exit 1
          fi

          # ── Gate de frescor: falha (→ GitHub notifica por email) se dados velhos ──
          # Limiares: cobertura mínima 50/103 e estado atualizado nas últimas 48h.
          COBERTURA_MIN=50
          IDADE_MAX_H=48
          FALHA=0

          if [ "$EMP" = "null" ] || [ "$EMP" -lt "$COBERTURA_MIN" ] 2>/dev/null; then
            echo "::error::Cobertura baixa: $EMP emissores com dados (< $COBERTURA_MIN). Ingestão pode estar travada."
            FALHA=1
          fi

          if [ "$UPD" = "null" ]; then
            echo "::error::Estado sem updated_at — sem prova de dados recentes."
            FALHA=1
          else
            UPD_EPOCH=$(date -d "$UPD" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date +%s)
            if [ "$UPD_EPOCH" -eq 0 ]; then
              echo "::warning::Não consegui parsear updated_at ($UPD) — pulando checagem de idade."
            else
              IDADE_H=$(( (NOW_EPOCH - UPD_EPOCH) / 3600 ))
              echo "Idade do estado: ${IDADE_H}h"
              if [ "$IDADE_H" -gt "$IDADE_MAX_H" ]; then
                echo "::error::Estado desatualizado há ${IDADE_H}h (> ${IDADE_MAX_H}h). Notícias podem estar paradas."
                FALHA=1
              fi
            fi
          fi

          if [ "$FALHA" = "1" ]; then
            echo "FRESCOR: PROBLEMA — ver erros acima."
            exit 1
          fi
          echo "FRESCOR: OK — $EMP emissores com dados, estado atualizado dentro de ${IDADE_MAX_H}h."
